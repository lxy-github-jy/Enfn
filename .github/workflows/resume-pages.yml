name: Deploy resume to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['resume/**', '.github/workflows/resume-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resume-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: resume/package-lock.json
      - run: npm ci
        working-directory: resume
      - run: npm run build
        working-directory: resume
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: resume/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
